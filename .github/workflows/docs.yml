name: Docs

# Publishes the DocC catalog to GitHub Pages at https://swift-gamedev.github.io/Swaylib/ on every
# push to main. Pull requests only check that the docs build, in the Linux job of ci.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    # Keep in step with .swift-version, like the Linux job in ci.yml.
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false
      - name: Install X11 and OpenGL headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev
      - name: Generate the documentation
        run: |
          swift package --allow-writing-to-directory site \
            generate-documentation --target Swaylib --warnings-as-errors \
            --transform-for-static-hosting --hosting-base-path Swaylib --output-path site
      - name: Send the site root to the landing page
        # DocC's root index.html is an empty shell that shows "page not found". Every page has its
        # own copy of that shell, so the root can be replaced with a redirect.
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>Swaylib</title>
          <meta http-equiv="refresh" content="0; url=documentation/swaylib/">
          <link rel="canonical" href="documentation/swaylib/">
          </head>
          <body><a href="documentation/swaylib/">Swaylib documentation</a></body>
          </html>
          EOF
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}documentation/swaylib/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
